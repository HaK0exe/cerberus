# Generic password-in-config detection.

- id: generic-password-assignment
  name: Generic Password Assignment
  regex: '(?i)(password|passwd|pwd)\s*[:=]\s*["'']([^"''\s]{8,})["'']'
  secret_group: 2
  keywords:
    - password
    - passwd
    - pwd
  negative_keywords:
    - example
    - placeholder
    - changeme
    - password123
  entropy:
    enabled: false
  severity: medium
  confidence: 0.4
