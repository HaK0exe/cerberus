# Broad provider-agnostic credential assignment detection.
#
# Technique: a single case-insensitive alternation of ~100 well-known
# secret-bearing key names (access_key, client_secret, db_password,
# docker_password, encryption_key, ...) in `key = value` / `key: value`
# assignment position, capturing the assigned value. This is the same
# family of technique Gitleaks-style generic rules use: the key name
# carries the signal, the value shape is deliberately permissive.
#
# Deliberately EXCLUDED from the alternation (documented here so a
# future edit doesn't re-add them):
#   - bare stems already covered by generic-api-key-assignment /
#     generic-password-assignment for 20+ char values (secret, token,
#     password, passwd, pwd are intentionally NOT bare alternatives;
#     only their compound forms appear below);
#   - non-secret identifiers: config, appspot, apidocs, app_debug,
#     app_log_level, cache_driver, elastica_host, elastica_port,
#     db_server, database_schema_test, dot-files, dotfiles,
#     cloudinary_name, app_id, admin_user, db_username, dbuser.
#
# Overlap note: values of 20+ chars whose key contains a secret/token/
# api_key stem may ALSO match generic-api-key-assignment, yielding two
# findings for one value (different rule IDs, same fingerprint).
# Downstream correlation (internal/credentials, keyed on Fingerprint)
# merges those; the duplication is the price of the wider net.
#
# Calibration: base 0.6 + 0.10 keyword (the key name is always inside
# the context window) + entropy verdict lands most hits in
# low_confidence / llm_review — emitted by the shipping CLI
# (WithMinEmitBand(BandLowConfidence)) but never auto-finding
# (>= 0.90). Keep it that way: raising confidence here would collapse
# corpus precision (see internal/detector/benchmark floor >= 0.90).

- id: generic-credential-assignment
  name: Generic Credential Assignment
  regex: '(?i)(access_key|access_token|admin_pass|algolia_admin_key|algolia_api_key|alias_pass|alicloud_access_key|amazon_secret_access_key|amazonaws|ansible_vault_password|aos_key|api_key|api_key_secret|api_key_sid|api_secret|apikey|app_key|app_secret|appkey|appkeysecret|application_key|appsecret|auth_token|authorizationtoken|authsecret|aws_access|aws_access_key_id|aws_bucket|aws_key|aws_secret|aws_secret_key|aws_token|awssecretkey|b2_app_key|bashrc_password|bintray_apikey|bintray_gpg_password|bintray_key|bintraykey|bluemix_api_key|bluemix_pass|browserstack_access_key|bucket_password|bucketeer_aws_access_key_id|bucketeer_aws_secret_access_key|built_branch_deploy_key|bx_password|cache_s3_secret_key|cattle_access_key|cattle_secret_key|certificate_password|ci_deploy_password|client_secret|client_zpk_secret_key|clojars_password|cloud_api_key|cloud_watch_aws_access_key|cloudant_password|cloudflare_api_key|cloudflare_auth_key|cloudinary_api_secret|codecov_token|conn\.login|connectionstring|consumer_key|consumer_secret|credentials|cypress_record_key|database_password|datadog_api_key|datadog_app_key|db_password|dbpasswd|dbpassword|deploy_password|digitalocean_ssh_key_body|digitalocean_ssh_key_ids|docker_hub_password|docker_key|docker_pass|docker_passwd|docker_password|dockerhub_password|dockerhubpassword|droplet_travis_password|dynamoaccesskeyid|dynamosecretaccesskey|elasticsearch_password|encryption_key|encryption_password|heroku_api_key|sonatype_password|api\.googlemaps)\s*[:=]\s*["'']?([^"''\s;,}]{8,})["'']?'
  secret_group: 2
  keywords:
    - access_key
    - access_token
    - secret
    - token
    - password
    - passwd
    - api_key
    - apikey
    - credentials
    - connectionstring
  negative_keywords:
    - example
    - placeholder
    - changeme
    - your_api_key
    - dummy
    - sample
    - process.env
  entropy:
    enabled: true
    threshold: 3.5
  severity: medium
  confidence: 0.6

- id: google-maps-api-key
  name: Google Maps API Key
  regex: '\b(AIza[0-9A-Za-z_\-]{35})\b'
  secret_group: 1
  keywords:
    - aiza
    - googlemaps
    - google
  negative_keywords:
    - example
    - placeholder
  entropy:
    enabled: false
  severity: high
  confidence: 0.95
