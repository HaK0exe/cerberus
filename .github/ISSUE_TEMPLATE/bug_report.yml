name: Bug report
description: Something isn't working as expected
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `cerberus scan file ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cerberus version / commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core / detector
        - rules
        - git scanner
        - web scanner
        - llm
        - api
        - mcp
        - remediation / aws
        - terraform / deploy
        - ci
        - docs
        - other
    validations:
      required: true
